<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>论文 · 王秋生课题组毕业文章展示站</title>
<style>
:root{
  --bg:#eef2fb; --card:#ffffff; --line:#e3e8f2; --text:#1e293b; --muted:#64748b;
  --accent:#4f6ef7; --accent-soft:#eef1fe;
  --hero1:#1e2a78; --hero2:#3b4fd8; --hero3:#6d5bd0; --hero4:#9a6ce0;
  --radius:14px; --shadow:0 2px 6px rgba(30,41,59,.06); --shadow-lg:0 12px 28px rgba(30,41,59,.13);
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif; background:linear-gradient(160deg,#eef2fb 0%,#f8fafc 46%,#f3edfb 100%); background-attachment:fixed; color:var(--text); font-size:14px; line-height:1.75;}
.wrap{max-width:1180px; margin:0 auto; padding:30px 18px 70px;}
.site-nav{position:sticky; top:0; z-index:200; background:rgba(255,255,255,.85); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-bottom:1px solid var(--line); box-shadow:0 2px 14px rgba(30,41,59,.06);}
.nav-inner{max-width:1180px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 18px;}
.brand{display:inline-flex; align-items:center; gap:9px; font-weight:800; font-size:15.5px; color:var(--text); text-decoration:none; letter-spacing:.3px;}
.brand-logo{width:34px; height:34px; border-radius:10px; display:inline-flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#3b4fd8,#8b5cf6); color:#fff; box-shadow:0 4px 12px rgba(79,110,247,.35);}
.nav-links{display:flex; gap:6px; flex-wrap:wrap;}
.nav-link{display:inline-flex; align-items:center; gap:6px; padding:8px 16px; border-radius:10px; text-decoration:none; color:var(--muted); font-size:13.5px; font-weight:600; transition:all .15s;}
.nav-link:hover{background:var(--accent-soft); color:var(--accent);}
.nav-link.active{background:linear-gradient(135deg,var(--accent),#7c5cf0); color:#fff; box-shadow:0 4px 14px rgba(79,110,247,.38);}
@media (max-width:640px){ .brand .brand-txt{display:none;} .nav-link{padding:8px 12px; font-size:13px;} }.page-head{background:linear-gradient(135deg,var(--hero1) 0%,var(--hero2) 48%,var(--hero3) 100%); color:#fff; border-radius:22px; padding:36px 38px; margin-bottom:22px; box-shadow:0 14px 36px rgba(59,79,216,.28); position:relative; overflow:hidden;}
.page-head::after{content:""; position:absolute; width:260px; height:260px; right:-80px; top:-120px; border-radius:50%; background:radial-gradient(circle,rgba(255,255,255,.20),transparent 65%);}
.page-head h1{font-size:28px; font-weight:800; letter-spacing:.5px; margin-bottom:8px; position:relative;}
.page-head p{font-size:13.5px; color:rgba(255,255,255,.92); max-width:820px; position:relative; line-height:1.9;}
.note{display:inline-block; margin-top:14px; font-size:12px; color:rgba(255,255,255,.9); background:rgba(255,255,255,.13); border:1px solid rgba(255,255,255,.28); border-radius:999px; padding:5px 13px; position:relative;}
.dir-tabs{display:flex; flex-wrap:wrap; gap:9px; margin-bottom:22px;}
.dir-tab{display:inline-flex; align-items:center; gap:7px; font-size:12.5px; font-weight:700; color:var(--text); background:#fff; border:1px solid var(--line); border-radius:999px; padding:7px 14px; text-decoration:none; transition:all .15s; box-shadow:var(--shadow);}
.dir-tab i{width:9px; height:9px; border-radius:50%; background:var(--tc);}
.dir-tab:hover{transform:translateY(-2px); box-shadow:var(--shadow-lg);}
.dir-tab .cnt{color:var(--muted); font-weight:600;}
.dir-sec{margin-bottom:34px; scroll-margin-top:86px;}
.dsec-head{display:flex; align-items:center; gap:12px; margin-bottom:14px; background:#fff; border:1px solid var(--line); border-left:6px solid var(--dc); border-radius:var(--radius); padding:16px 20px; box-shadow:var(--shadow);}
.dsec-head h2{font-size:18px; font-weight:800;}
.dsec-head .desc{font-size:12.5px; color:var(--muted); margin-top:2px; line-height:1.7;}
.dsec-head .cnt{margin-left:auto; font-size:12px; font-weight:700; color:#fff; background:var(--dc); border-radius:999px; padding:4px 12px; white-space:nowrap;}
.paper-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:13px;}
.paper-card{background:#fff; border:1px solid var(--line); border-left:5px solid var(--dc); border-radius:var(--radius); padding:16px 18px; cursor:default; box-shadow:var(--shadow); transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease; overflow:hidden;}
.paper-card:hover{transform:translateY(-3px); box-shadow:var(--shadow-lg); border-color:#c9d5f8;}
.p-head{display:flex; align-items:flex-start; gap:12px;}
.p-no{flex:none; min-width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; color:#fff; background:var(--dc); box-shadow:0 4px 10px rgba(30,41,59,.14);}
.p-main{flex:1; min-width:0;}
.p-title{font-weight:800; font-size:14.5px; line-height:1.65;}
.p-meta{font-size:12.5px; color:var(--muted); margin-top:5px; display:flex; flex-wrap:wrap; gap:6px;}
.p-meta span{display:inline-flex; align-items:center; gap:4px; background:#f4f6fc; border:1px solid var(--line); border-radius:999px; padding:2px 9px;}
.p-brief{font-size:12.5px; color:var(--muted); line-height:1.75; margin-top:10px; padding-top:10px; border-top:1px dashed var(--line);}
.p-dims{display:block; margin-top:12px; padding-top:12px; border-top:1px solid var(--line); animation:fadeIn .22s ease;}
@keyframes fadeIn{from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:none;}}
.dim{display:flex; gap:10px; padding:9px 12px; border-radius:10px; background:#f7f9fe; margin-bottom:7px; align-items:flex-start; font-size:13px; line-height:1.8;}
.dim:nth-child(even){background:#f2f5fc;}
.dim .dt{flex:none; width:120px; font-weight:700; color:var(--dc); display:flex; align-items:flex-start; gap:6px; font-size:12.5px;}
.dim .dt i{font-style:normal;}
.dim .dv{color:var(--text); min-width:0;}
@media (max-width:900px){ .paper-grid{grid-template-columns:1fr;} }
@media (max-width:560px){ .page-head{padding:28px 22px;} .dim{flex-direction:column; gap:2px;} .dim .dt{width:auto;} }
</style>
</head>
<body>
<nav class="site-nav">
  <div class="nav-inner">
    <a class="brand" href="index.html"><span class="brand-logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span><span class="brand-txt">王秋生课题组 · 毕业文章展</span></a>
    <div class="nav-links"><a class="nav-link" href="index.html">首页</a><a class="nav-link active" href="papers.html">论文</a><a class="nav-link" href="members.html">人员</a><a class="nav-link" href="mindmap.html">思维导图</a></div>
  </div>
</nav>
<main class="wrap">
  <section class="page-head">
    <h1>毕业文章总览</h1>
    <p>王秋生课题组历届学位论文按 8 个研究方向分区呈现，共收录 30 篇。每张卡片展示标题、作者、年份与一句话摘要，并直接呈现完整 8 维度精读：解决的问题 / 创新点 / 方法与实验设计 / 方法局限 / 数据来源 / 结果论证 / 文章结构组织 / 尚未解决的问题。</p>
    <span class="note">说明：第 19 篇按约定跳过不展开展示；第 21 篇未收录</span>
  </section>
  <div id="dirTabs" class="dir-tabs"></div>
  <div id="dirSections"></div>
</main>
<footer style="text-align:center; color:var(--muted); font-size:12px; margin-top:40px; line-height:1.9;">王秋生课题组毕业文章展示站 ｜ 导师：王秋生 教授（北京工业大学 · 建筑工程学院） ｜ 第 19 篇按约定跳过，共收录 30 篇论文 · 8 个研究方向 · 29 位组内成员</footer>
<script src="data.js"></script>
<script>
const LABELS = {problem:"解决的问题", innovation:"创新点", method:"方法与实验设计", limitation:"方法局限", data:"数据来源", result:"结果论证", structure:"文章结构组织", future:"尚未解决的问题"};
function dimsHtml(p, color){
  return DIM_KEYS.filter(k => p.dims && p.dims[k]).map(k =>
    '<div class="dim"><div class="dt"><i>' + (dimIcons[k] || "·") + '</i>' + LABELS[k] + '</div><div class="dv">' + esc(p.dims[k]).replace(/\n/g, "<br>") + '</div></div>'
  ).join("");
}
function paperCard(p){
  const d = dirOf(p.dir);
  const author = p.author || "";
  const year = p.year || "";
  const degree = p.degree || (p.meta && p.meta.indexOf ? p.meta : "") || "";
  const brief = p.brief || (p.dims && p.dims.problem) || "";
  return '<div class="paper-card" data-id="' + p.id + '" style="--dc:' + d.color + '">' +
    '<div class="p-head"><span class="p-no">' + esc(p.id) + '</span>' +
    '<div class="p-main"><div class="p-title">' + esc(p.title) + '</div>' +
    '<div class="p-meta"><span>✍ ' + esc(author) + '</span>' + (year ? '<span>📅 ' + esc(year) + '</span>' : '') + (degree ? '<span>🎓 ' + esc(degree) + '</span>' : '') + '</div></div></div>' +
    '<div class="p-brief">' + esc(brief) + '</div>' +
    '<div class="p-dims">' + dimsHtml(p, d.color) + '</div></div>';
}
document.getElementById("dirTabs").innerHTML = dirs.map(d =>
  '<a class="dir-tab" style="--tc:' + d.color + '" href="#' + d.id + '"><i></i>' + esc(d.name) + ' <span class="cnt">' + papers.filter(p=>p.dir===d.id).length + '</span></a>'
).join("");
document.getElementById("dirSections").innerHTML = dirs.map(d => {
  const list = papers.filter(p => p.dir === d.id);
  return '<section class="dir-sec" id="' + d.id + '">' +
    '<div class="dsec-head" style="--dc:' + d.color + '"><div><h2>' + esc(d.name) + '</h2><div class="desc">' + esc(d.desc) + '</div></div><span class="cnt">' + list.length + ' 篇</span></div>' +
    '<div class="paper-grid">' + list.map(paperCard).join("") + '</div></section>';
}).join("");
window.addEventListener("load", () => {
  const h = location.hash;
  if (h && h.startsWith("#d")) {
    const el = document.getElementById(h.slice(1));
    if (el) el.scrollIntoView({behavior:"smooth", block:"start"});
  }
});
</script>
</body>
</html>
