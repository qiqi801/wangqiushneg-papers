<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人员 · 王秋生课题组毕业文章展示站</title>
<style>
:root{
  --bg:#eef2fb; --card:#ffffff; --line:#e3e8f2; --text:#1e293b; --muted:#64748b;
  --accent:#4f6ef7; --accent-soft:#eef1fe;
  --hero1:#1e2a78; --hero2:#3b4fd8; --hero3:#6d5bd0; --hero4:#9a6ce0;
  --radius:14px; --shadow:0 2px 6px rgba(30,41,59,.06); --shadow-lg:0 12px 28px rgba(30,41,59,.13);
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif; background:linear-gradient(160deg,#eef2fb 0%,#f8fafc 46%,#f3edfb 100%); background-attachment:fixed; color:var(--text); font-size:14px; line-height:1.75;}
.wrap{max-width:1180px; margin:0 auto; padding:30px 18px 70px;}
.site-nav{position:sticky; top:0; z-index:200; background:rgba(255,255,255,.85); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-bottom:1px solid var(--line); box-shadow:0 2px 14px rgba(30,41,59,.06);}
.nav-inner{max-width:1180px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 18px;}
.brand{display:inline-flex; align-items:center; gap:9px; font-weight:800; font-size:15.5px; color:var(--text); text-decoration:none; letter-spacing:.3px;}
.brand-logo{width:34px; height:34px; border-radius:10px; display:inline-flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#3b4fd8,#8b5cf6); color:#fff; box-shadow:0 4px 12px rgba(79,110,247,.35);}
.nav-links{display:flex; gap:6px; flex-wrap:wrap;}
.nav-link{display:inline-flex; align-items:center; gap:6px; padding:8px 16px; border-radius:10px; text-decoration:none; color:var(--muted); font-size:13.5px; font-weight:600; transition:all .15s;}
.nav-link:hover{background:var(--accent-soft); color:var(--accent);}
.nav-link.active{background:linear-gradient(135deg,var(--accent),#7c5cf0); color:#fff; box-shadow:0 4px 14px rgba(79,110,247,.38);}
@media (max-width:640px){ .brand .brand-txt{display:none;} .nav-link{padding:8px 12px; font-size:13px;} }.page-head{background:linear-gradient(135deg,var(--hero1) 0%,var(--hero2) 48%,var(--hero3) 100%); color:#fff; border-radius:22px; padding:36px 38px; margin-bottom:22px; box-shadow:0 14px 36px rgba(59,79,216,.28); position:relative; overflow:hidden;}
.page-head::after{content:""; position:absolute; width:260px; height:260px; right:-80px; top:-120px; border-radius:50%; background:radial-gradient(circle,rgba(255,255,255,.20),transparent 65%);}
.page-head h1{font-size:28px; font-weight:800; letter-spacing:.5px; margin-bottom:8px; position:relative;}
.page-head p{font-size:13.5px; color:rgba(255,255,255,.92); max-width:820px; position:relative; line-height:1.9;}
.hb-row{position:relative; display:flex; flex-wrap:wrap; gap:10px; margin-top:16px;}
.hb2{display:inline-flex; align-items:center; gap:7px; font-size:12px; font-weight:700; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.30); border-radius:999px; padding:6px 13px;}
.member-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:15px;}
.mcard{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:18px; cursor:pointer; box-shadow:var(--shadow); transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease; position:relative; overflow:hidden;}
.mcard::before{content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--mc);}
.mcard:hover{transform:translateY(-4px); box-shadow:var(--shadow-lg); border-color:#c9d5f8;}
.mcard.open{border-color:var(--mc); box-shadow:0 10px 26px rgba(30,41,59,.12);}
.m-top{display:flex; align-items:center; gap:12px;}
.m-avatar{flex:none; width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:19px; font-weight:800; color:#fff; background:linear-gradient(135deg,var(--mc),#4f6ef7); box-shadow:0 5px 12px rgba(30,41,59,.18);}
.m-name{font-size:16px; font-weight:800; line-height:1.4;}
.m-meta{display:flex; flex-wrap:wrap; gap:6px; margin-top:4px;}
.m-meta span{font-size:11px; font-weight:700; color:var(--muted); background:#f4f6fc; border:1px solid var(--line); border-radius:999px; padding:2px 9px;}
.m-dir{display:inline-flex; align-items:center; gap:6px; margin-top:12px; font-size:12px; font-weight:700; color:var(--mc); border:1px solid var(--mc); border-radius:999px; padding:3px 11px; background:rgba(255,255,255,.6);}
.m-work{font-size:12.5px; color:var(--muted); line-height:1.75; margin-top:10px; min-height:42px;}
.m-paps{font-size:12px; font-weight:700; color:var(--accent); margin-top:6px;}
.m-arrow{position:absolute; right:14px; top:18px; color:var(--muted); font-size:12px; transition:transform .2s;}
.mcard.open .m-arrow{transform:rotate(180deg); color:var(--mc);}
.m-detail{display:none; margin-top:13px; padding-top:13px; border-top:1px solid var(--line);}
.mcard.open .m-detail{display:block; animation:fadeIn .22s ease;}
@keyframes fadeIn{from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:none;}}
.mp-card{border:1px solid var(--line); border-left:4px solid var(--mc); border-radius:10px; padding:12px 14px; margin-bottom:9px; background:#fafbfe;}
.mp-card:last-child{margin-bottom:0;}
.mp-head{display:flex; align-items:flex-start; gap:9px;}
.mp-badge{flex:none; min-width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:11.5px; color:#fff; background:var(--mc);}
.mp-title{font-size:13px; font-weight:700; line-height:1.55; min-width:0;}
.mp-meta{font-size:11.5px; color:var(--muted); margin-top:3px;}
.mp-dims{margin-top:9px;}
.dim{display:flex; gap:10px; padding:8px 11px; border-radius:9px; background:#f7f9fe; margin-bottom:6px; align-items:flex-start; font-size:12.5px; line-height:1.8;}
.dim:nth-child(even){background:#f2f5fc;}
.dim .dt{flex:none; width:118px; font-weight:700; color:var(--mc); display:flex; align-items:flex-start; gap:5px; font-size:12px;}
.dim .dt i{font-style:normal;}
.dim .dv{color:var(--text); min-width:0;}
@media (max-width:1000px){ .member-grid{grid-template-columns:repeat(2,1fr);} }
@media (max-width:640px){ .member-grid{grid-template-columns:1fr;} .page-head{padding:28px 22px;} .dim{flex-direction:column; gap:2px;} .dim .dt{width:auto;} }
</style>
</head>
<body>
<nav class="site-nav">
  <div class="nav-inner">
    <a class="brand" href="index.html"><span class="brand-logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span><span class="brand-txt">王秋生课题组 · 毕业文章展</span></a>
    <div class="nav-links"><a class="nav-link" href="index.html">首页</a><a class="nav-link" href="papers.html">论文</a><a class="nav-link active" href="members.html">人员</a><a class="nav-link" href="mindmap.html">思维导图</a></div>
  </div>
</nav>
<main class="wrap">
  <section class="page-head">
    <h1>组内成员</h1>
    <p>历届师兄师姐卡片墙：姓名、届别、学历、研究方向与对应论文一目了然。点击任意成员卡片，即可展开其全部论文的完整 8 维度精读详情。</p>
    <div class="hb-row">
      <span class="hb2">👥 <b id="st-members">29</b> 位成员</span>
      <span class="hb2">📚 对应论文 30 篇</span>
      <span class="hb2">🧭 8 大研究方向</span>
    </div>
  </section>
  <div id="memberGrid" class="member-grid"></div>
</main>
<footer style="text-align:center; color:var(--muted); font-size:12px; margin-top:40px; line-height:1.9;">王秋生课题组毕业文章展示站 ｜ 导师：王秋生 教授（北京工业大学 · 建筑工程学院） ｜ 第 19 篇按约定跳过，共收录 30 篇论文 · 8 个研究方向 · 29 位组内成员</footer>
<script src="data.js"></script>
<script>
const LABELS = {problem:"解决的问题", innovation:"创新点", method:"方法与实验设计", limitation:"方法局限", data:"数据来源", result:"结果论证", structure:"文章结构组织", future:"尚未解决的问题"};
const truncate = (s, n) => s && s.length > n ? s.slice(0, n) + "……" : (s || "");
function dimsHtml(p, color){
  return DIM_KEYS.filter(k => p.dims && p.dims[k]).map(k =>
    '<div class="dim"><div class="dt"><i>' + (dimIcons[k] || "·") + '</i>' + LABELS[k] + '</div><div class="dv">' + esc(p.dims[k]) + '</div></div>'
  ).join("");
}
function paperBlock(id, color){
  const p = papersById[id];
  if (!p) return "";
  const degree = p.degree || (p.meta && p.meta.indexOf ? p.meta : "") || "";
  return '<div class="mp-card" style="--mc:' + color + '">' +
    '<div class="mp-head"><span class="mp-badge">' + esc(p.id) + '</span>' +
    '<div><div class="mp-title">' + esc(p.title) + '</div>' +
    '<div class="mp-meta">' + esc(p.author || "") + (p.year ? ' · ' + esc(p.year) : '') + (degree ? ' · ' + esc(degree) : '') + '</div></div></div>' +
    '<div class="mp-dims">' + dimsHtml(p, color) + '</div></div>';
}
function memberCard(m){
  const d = dirOf(m.dir);
  const metaArr = m.meta ? String(m.meta).split("届") : [];
  const year = metaArr.length > 1 ? (metaArr[0] + "届") : "";
  const degree = metaArr.length > 1 ? metaArr[1] : (m.meta || "");
  const paps = (m.papers || []);
  return '<div class="mcard" data-id="' + m.id + '" style="--mc:' + d.color + '">' +
    '<span class="m-arrow">▾</span>' +
    '<div class="m-top"><div class="m-avatar">' + esc(String(m.name).slice(0,1)) + '</div>' +
    '<div><div class="m-name">' + esc(m.name) + '</div><div class="m-meta">' + (year ? '<span>🎓 ' + esc(year) + '</span>' : '') + (degree ? '<span>📘 ' + esc(degree.trim()) + '</span>' : '') + '</div></div></div>' +
    '<div class="m-dir">🧭 ' + esc(d.name) + '</div>' +
    '<div class="m-work">' + esc(truncate(m.work, 60) || "研究方向聚焦于" + d.name) + '</div>' +
    '<div class="m-paps">对应论文 ' + paps.length + ' 篇 · 点击展开详情</div>' +
    '<div class="m-detail">' + paps.map(id => paperBlock(id, d.color)).join("") + '</div></div>';
}
document.getElementById("st-members").textContent = members.length;
document.getElementById("memberGrid").innerHTML = members.map(memberCard).join("");
document.querySelectorAll(".mcard").forEach(card => {
  card.addEventListener("click", () => card.classList.toggle("open"));
});
window.addEventListener("load", () => {
  const h = location.hash;
  if (h && h.startsWith("#m")) {
    const el = document.querySelector('.mcard[data-id="' + h.slice(1) + '"]');
    if (el) { el.classList.add("open"); el.scrollIntoView({behavior:"smooth", block:"center"}); }
  }
});
</script>
</body>
</html>
